[project]
name = "landlord"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.4.0",
    "fastapi[standard]>=0.163.1",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "neonize>=0.10.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: errors and warnings
    "F",       # pyflakes: unused imports / variables, undefined names
    "I",       # import order
    "B",       # bugbear: common bugs
    "UP",      # pyupgrade: modern Python syntax
    "SIM",     # simplify: shorter equivalent code
]
ignore = [
    "E501",  # line too long: the formatter handles length; long prompt strings stay as written
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as default arguments; these calls are meant to be there.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query", "fastapi.Body"]
