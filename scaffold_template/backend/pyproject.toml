[project]
name = "__PROJECT_SLUG__"
version = "0.1.0"
description = "__PROJECT_NAME__ backend"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: errors and warnings
    "F",       # pyflakes: unused imports / variables, undefined names
    "I",       # import order
    "B",       # bugbear: common bugs
    "UP",      # pyupgrade: modern Python syntax
    "SIM",     # simplify: shorter equivalent code
]
ignore = [
    "E501",  # line too long: the formatter handles length
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as default arguments; these calls are meant to be there.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query", "fastapi.Body"]
